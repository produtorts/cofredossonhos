<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Painel · Cofre dos Sonhos</title>
<link rel="icon" href="../icone-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--noite:#0c1222;--ardosia:#141c31;--cartao:#19223b;--linha:#27324f;--gelo:#edf1f8;--nevoa:#9aa6be;--ouro:#e2c48a;--ouro-forte:#c9a45f;--tinta:#1d1608;--aurora:#7fe0c9;--alerta:#f2a07b;--perigo:#ef8d8d;--zap:#25d366}
  *{box-sizing:border-box} html,body{margin:0;background:var(--noite);color:var(--gelo);font:15px/1.45 "DM Sans",system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .topo{position:sticky;top:0;z-index:5;background:rgba(12,18,34,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .marca{font-family:Lora,serif;font-size:19px;font-weight:500;margin-right:auto} .marca em{color:var(--ouro);font-style:italic;font-weight:400} .marca small{display:block;font:500 11px "DM Sans";letter-spacing:.14em;color:var(--nevoa);text-transform:uppercase}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  .b{border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
  .b:hover{border-color:var(--ouro-forte)} .b.ouro{background:var(--ouro);color:var(--tinta);border-color:var(--ouro)}
  .b.zap{background:var(--zap);border-color:var(--zap);color:#062b14;font-weight:700;white-space:nowrap}
  .b.pequeno{padding:7px 12px;font-size:13.5px}
  .b:disabled{opacity:.45;cursor:not-allowed}
  /* abas (igual ao painel da Fábrica) */
  .pn-abas{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .pn-aba{border:1px solid var(--linha);background:var(--ardosia);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--gelo)}
  .pn-aba[aria-pressed=true]{border-color:var(--ouro);background:rgba(226,196,138,.1);color:var(--ouro)}
  .pn-topo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
  .pn-topo h1{font-family:Lora,serif;font-weight:500;font-size:clamp(26px,4vw,34px);margin:0}
  .pn-topo h1 em{color:var(--ouro);font-weight:400}
  .pn-periodos{display:flex;flex-wrap:wrap;gap:6px;flex:1;justify-content:center}
  .chip{border:1px solid var(--linha);background:var(--ardosia);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--gelo);min-height:38px}
  .chip[aria-pressed=true]{border-color:var(--ouro);background:rgba(226,196,138,.1);color:var(--ouro)}
  /* cartões */
  .pn-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
  .pn-card{background:var(--ardosia);border:1px solid var(--linha);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
  .pn-card span{font-size:12.5px;color:var(--nevoa);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .pn-card strong{font-size:clamp(24px,3vw,32px);font-weight:700;line-height:1.1;color:var(--gelo);font-variant-numeric:tabular-nums}
  .pn-card small{font-size:12.5px;color:var(--nevoa)}
  .pn-card.s-verde{border-color:#2f6b5c;background:linear-gradient(160deg,rgba(127,224,201,.1),var(--ardosia))}.pn-card.s-verde strong{color:var(--aurora)}
  .pn-card.s-ouro{border-color:#6b5a35;background:linear-gradient(160deg,rgba(226,196,138,.1),var(--ardosia))}.pn-card.s-ouro strong{color:var(--ouro)}
  .pn-card.s-alerta{border-color:#7a4a35;background:linear-gradient(160deg,rgba(242,160,123,.1),var(--ardosia))}.pn-card.s-alerta strong{color:var(--alerta)}
  .pn-saas .info{font-style:normal;cursor:help;opacity:.7}
  .pn-saas .pn-card .ex{display:none;font-style:normal;font-size:12px;color:var(--gelo);opacity:.85;margin-top:4px;line-height:1.35;text-transform:none;letter-spacing:0}
  .pn-saas .pn-card:hover .ex,.pn-saas .pn-card:focus-within .ex{display:block}
  .pn-saas-trafego{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:14px 0 4px}
  .pn-saas-trafego label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--nevoa)}
  .pn-saas-trafego input{background:var(--ardosia);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;color:var(--gelo);width:180px}
  .pn-card.destaque{border-color:#2f6b5c;background:linear-gradient(160deg,rgba(127,224,201,.09),var(--ardosia))}
  .pn-card.destaque strong{color:var(--aurora)}
  .pn-card.ouro{border-color:#6b5a35;background:linear-gradient(160deg,rgba(226,196,138,.1),var(--ardosia))}
  .pn-card.ouro strong{color:var(--ouro)}
  .pn-card.alerta{border-color:#7a4a35;background:linear-gradient(160deg,rgba(242,160,123,.1),var(--ardosia))}
  .pn-card.alerta strong{color:var(--alerta)}
  button.pn-card{cursor:pointer;font:inherit;color:inherit} button.pn-card:hover{border-color:var(--ouro-forte)}
  button.pn-card[aria-pressed=true]{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro) inset}
  /* blocos */
  .pn-bloco{background:var(--ardosia);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px}
  .pn-bloco h2{font-family:Lora,serif;font-size:21px;font-weight:500;margin:0 0 6px}
  .pn-bloco h3{font-size:14px;font-weight:700;margin:4px 0 10px}
  .mudo{color:var(--nevoa)} .pn-bloco .mudo{font-size:13.5px;margin:0 0 12px}
  .pn-funil{display:grid;gap:9px}
  .pn-linha{display:grid;grid-template-columns:minmax(130px,250px) 1fr 54px 150px;align-items:center;gap:10px;font-size:14px}
  .pn-linha .pn-rot small{display:block;color:var(--nevoa);font-size:12px}
  .pn-linha b{text-align:right;font-variant-numeric:tabular-nums}
  .pn-linha .pn-conv{font-size:12px;color:var(--nevoa)} .pn-linha .pn-conv em{font-style:normal;color:var(--aurora);font-weight:700}
  .pn-barra{height:12px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
  .pn-barra i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ouro-forte),var(--ouro))}
  .pn-barra.verde i{background:linear-gradient(90deg,#4fb8a0,var(--aurora))}
  .pn-dias{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
  .pn-dia{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--nevoa)}
  .pn-col{position:relative;width:100%;height:140px;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.03);border-radius:6px}
  .pn-col i{display:block;width:70%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--ouro),var(--ouro-forte))}
  .pn-col em{position:absolute;top:2px;font-style:normal;font-size:10.5px;color:var(--gelo)}
  .pn-dia-num{display:flex;gap:4px;justify-content:center;margin-top:4px}
  .pn-dia-num b,.pn-leg{display:inline-block;min-width:18px;padding:1px 5px;border-radius:5px;font-size:11px;background:rgba(255,255,255,.08);color:var(--gelo);text-align:center}
  .pn-dia-num b.pn-pg,.pn-leg.pn-pg{background:rgba(127,224,201,.16);color:var(--aurora)}
  .pn-grade2{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
  .pn-acoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .pn-link{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;background:var(--ardosia);margin-bottom:8px}
  .pn-link code{display:block;font-size:12.5px;color:var(--ouro);word-break:break-all;margin-top:3px}
  .campo{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--nevoa);font-weight:700}
  .campo input{background:var(--noite);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--gelo)}
  @media(max-width:600px){.pn-periodos{flex-basis:100%;justify-content:flex-start;order:3}}
  @media(max-width:860px){.pn-kpis,.pn-acoes{grid-template-columns:repeat(2,minmax(0,1fr))}.pn-grade2{grid-template-columns:1fr}.pn-linha{grid-template-columns:minmax(100px,150px) 1fr 40px;font-size:13px}.pn-linha .pn-conv{grid-column:1/-1;margin-top:-4px}}
  /* clientes */
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filtros input[type=search]{flex:1;min-width:200px;background:var(--ardosia);border:1px solid var(--linha);border-radius:10px;padding:9px 12px}
  .filtros .chip{border-radius:999px;font-weight:500;color:var(--nevoa);min-height:34px;padding:6px 12px;font-size:13px}
  .filtros .chip[aria-pressed=true]{color:var(--ouro)}
  .tabela-caixa{overflow-x:auto;border-radius:14px;border:1px solid var(--linha)}
  table{width:100%;border-collapse:collapse} th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--nevoa);font-weight:700;padding:12px 14px;background:var(--ardosia)}
  td{padding:12px 14px;border-top:1px solid var(--linha);vertical-align:middle}
  td small{color:var(--nevoa);display:block;font-size:12px}
  .tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .t-tri{background:#1d3a33;color:var(--aurora)} .t-men{background:#2a3350;color:#a9c1ff} .t-lib{background:#33301f;color:var(--ouro)}
  .t-teste{background:#22324a;color:#8fd0ff} .t-venc{background:#3d2420;color:var(--alerta)} .t-bas{background:#2c2c3a;color:#d4cfe8} .t-sem{background:#232a3c;color:var(--nevoa)}
  .quente{color:var(--alerta);font-weight:700}
  .vazio{color:var(--nevoa);text-align:center;padding:40px 0}
  .caixa{max-width:380px;margin:12vh auto;background:var(--ardosia);border:1px solid var(--linha);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
  .caixa input{background:var(--noite);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;width:100%}
  .nota{color:var(--nevoa);font-size:13px}
  dialog{background:var(--ardosia);color:var(--gelo);border:1px solid var(--linha);border-radius:16px;padding:20px;width:min(640px,calc(100vw - 32px))}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog textarea{width:100%;min-height:110px;background:var(--noite);border:1px solid var(--linha);border-radius:10px;padding:10px;resize:vertical}
  dialog h3{margin:14px 0 6px;font-size:14px}
  @media (max-width:760px){
    .tabela-clientes thead{display:none} .tabela-clientes,.tabela-clientes tbody,.tabela-clientes tr,.tabela-clientes td{display:block;width:100%} .tabela-clientes tr{border:1px solid var(--linha);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:var(--ardosia)}
    .tabela-clientes td{border:0;padding:6px 10px} .caixa-clientes{border:0;overflow:visible}
    .topo .b{padding:7px 10px;font-size:13px}
  }
  .pn-online{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:rgba(127,224,201,.1);color:var(--aurora);font-weight:700;font-size:13px;white-space:nowrap}
  .pn-online i{width:8px;height:8px;border-radius:50%;background:var(--aurora);box-shadow:0 0 0 3px rgba(127,224,201,.25)}
  .on-tag{display:inline-block;margin-left:6px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;background:rgba(127,224,201,.14);color:var(--aurora);vertical-align:middle}
  .nota-adm{display:block;margin-top:3px;color:var(--ouro);font-size:12.5px}
  .ed-grade{display:grid;gap:10px;margin-top:12px} .ed-grade label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--nevoa)}
  .ed-grade input,.ed-grade select,.ed-grade textarea{background:var(--noite);border:1px solid var(--linha);border-radius:10px;padding:9px 10px;color:var(--gelo)}
  .ed-duas{display:grid;grid-template-columns:1fr 1fr;gap:10px} .ed-ck{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--gelo)!important}
  .ed-ck input{width:18px;height:18px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlgMsg"></dialog>
<script>
(()=>{
// Senha própria do painel (não é a conta do app). Mostra quem está online e permite editar os clientes.
const FUNCAO="https://rvkziyvihxweyrqnhuuh.supabase.co/functions/v1/painel-dados", CHAVE="sb_publishable_LHIUAPcrjo-5A62OVVAe6w_qfPlIAjv";
const lerToken=()=>{ try{ return sessionStorage.getItem('painel-token')||''; }catch(e){ return ''; } };
const gravarToken=t=>{ try{ t?sessionStorage.setItem('painel-token',t):sessionStorage.removeItem('painel-token'); }catch(e){} };
async function chamar(corpo){
  const r=await fetch(FUNCAO,{method:'POST',headers:{'Content-Type':'application/json',apikey:CHAVE},body:JSON.stringify(corpo)});
  let d={}; try{ d=await r.json(); }catch(e){} return {ok:r.ok, status:r.status, d};
}
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=36e5, D=24*H;
let agora={}, clientes=[], filtro='todos', extra='', busca='', aba='geral', funilDias=7, funilDados=null, vezFunil=0;

// Situações (mesma regra do app) e a mensagem pronta de cada uma.
const SIT={
  tri:{n:'Premium trimestral', c:'t-tri'}, men:{n:'Premium mensal', c:'t-men'}, lib:{n:'Premium liberado', c:'t-lib'},
  teste:{n:'Teste 7 dias', c:'t-teste'}, venc:{n:'Teste vencido', c:'t-venc'}, bas:{n:'Básico vitalício', c:'t-bas'}, sem:{n:'Só cadastro', c:'t-sem'}
};
const MSG_PADRAO={
  bas:`Oi, {nome}! Aqui é do Cofre dos Sonhos 🔐

Vi que você já está guardando para a sua conquista no plano Básico. Que tal liberar tudo?

✨ Todos os wallpapers Premium (carros, motos, casas, viagens)
✨ Conquistas ilimitadas
✨ Wallpaper para computador em 4K
✨ Frase motivacional todo dia

O trimestral sai por R$ 29,90, menos de R$ 10 por mês. Quer que eu te mande o link?`,
  venc_promo:`Oi, {nome}! Seu teste Premium de 7 dias no Cofre dos Sonhos terminou e seus cofres estão pausados ⏸️

Mas separei uma condição pra você: até {prazo} o plano trimestral sai por R$ 24,90 (em vez de R$ 29,90). Você continua exatamente de onde parou, com todos os wallpapers.

Quer que eu te mande o link?`,
  venc:`Oi, {nome}! Seus cofres no Cofre dos Sonhos estão pausados desde o fim do teste ⏸️

Tudo que você guardou continua salvo. Para voltar, o trimestral sai por R$ 29,90 (menos de R$ 10 por mês) ou o mensal por R$ 12,90.

Quer que eu te mande o link?`,
  teste:`Oi, {nome}! Tudo certo com o seu teste Premium do Cofre dos Sonhos? 🔐

Faltam {dias} para acabar. Se quiser já garantir e não pausar nada, o trimestral sai por R$ 29,90.

Ficou alguma dúvida? Estou por aqui.`,
  men:`Oi, {nome}! Obrigado por ser Premium no Cofre dos Sonhos 💛

Uma dica para economizar: no plano trimestral você paga R$ 29,90 a cada 3 meses, em vez de R$ 38,70 no mensal. São R$ 8,80 a menos, com tudo igual.

Quer que eu faça a troca pra você?`,
  tri:`Oi, {nome}! Aqui é do Cofre dos Sonhos 💛 Passando para saber como está indo a sua conquista. Precisa de alguma ajuda com o app?`,
  lib:`Oi, {nome}! Aqui é do Cofre dos Sonhos 💛 Passando para saber como está indo a sua conquista. Precisa de alguma ajuda com o app?`,
  sem:`Oi, {nome}! Vi que você criou sua conta no Cofre dos Sonhos 🔐 mas ainda não começou. Quer que eu te ajude a montar o seu primeiro cofre?`,
  pix:`Oi, {nome}! Aqui é do Cofre dos Sonhos 🔐

Vi que você gerou o Pix do Premium {plano} ({valor}), mas o pagamento não chegou a ser concluído.

Ficou alguma dúvida ou deu algum problema na hora de pagar? Se quiser, é só abrir o app em Mais › Meu plano que o seu Pix continua lá, e o Premium libera na hora.

Qualquer coisa, me chama aqui 💛`
};
const ROT_MSG={pix:'Gerou Pix e não pagou',bas:'Básico vitalício',venc_promo:'Teste vencido (até 48h, com desconto)',venc:'Teste vencido (depois de 48h)',teste:'Teste 7 dias em andamento',men:'Premium mensal',tri:'Premium trimestral',lib:'Premium liberado',sem:'Só cadastro'};
const lerMsgs=()=>{ try{ return Object.assign({},MSG_PADRAO,JSON.parse(localStorage.getItem('painel-msgs')||'{}')); }catch(e){ return {...MSG_PADRAO}; } };

function situacao(c){
  const agora=Date.now(), ativo=(pl,ate)=>!!pl && !!ate && pl!=='entrada' && Date.parse(ate)>agora;
  const fimTeste=c.teste_ate?Date.parse(c.teste_ate):0;
  if(ativo(c.plano,c.plano_ate) && (!fimTeste || Date.parse(c.plano_ate)>fimTeste+60e3) || ativo(c.kiwify_plano,c.kiwify_plano_ate)){
    if(c.assinatura_status==='ativa') return c.assinatura_ciclo==='QUARTERLY'?'tri':'men';
    return 'lib';
  }
  if(fimTeste>agora) return 'teste';
  if(c.kiwify_basico) return 'bas';
  if(fimTeste) return 'venc';
  return 'sem';
}
function detalhe(c){
  const agora=Date.now(), fim=c.teste_ate?Date.parse(c.teste_ate):0;
  switch(c.sit){
    case 'teste': { const d=Math.ceil((fim-agora)/D); return `faltam ${d} dia${d>1?'s':''}`; }
    case 'venc': { const h=Math.floor((agora-fim)/H); return h<48 ? `<span class="quente">venceu há ${h}h · desconto até ${fmtData(fim+48*H,true)}</span>` : `venceu há ${Math.floor(h/24)} dias`; }
    case 'bas': { const d=Math.floor((agora-Date.parse(c.criado))/D); return `há ${d} dia${d===1?'':'s'}`; }
    case 'lib': case 'men': case 'tri': return c.plano_ate||c.kiwify_plano_ate ? 'até '+fmtData(Date.parse(c.plano_ate||c.kiwify_plano_ate)) : '';
    default: return '';
  }
}
const fmtData=(t,hora)=>{ const s=new Date(t).toLocaleString('pt-BR',hora?{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'2-digit',year:'numeric'}); return hora?s.replace(', ',' às '):s; };
const haQuanto=t=>{ const m=Math.max(1,Math.round((Date.now()-Date.parse(t))/60000)); return m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)}h`:`há ${Math.round(m/1440)} dia${m>=2880?'s':''}`; };
const fmtZap=n=>{ if(!n) return ''; const d=n.replace(/^55/,''); return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; };
const primeiro=n=>{ const p=String(n||'').trim().split(/\s+/)[0]||''; return p? p.charAt(0).toLocaleUpperCase('pt-BR')+p.slice(1).toLocaleLowerCase('pt-BR') : ''; };

const PRECO_PIX = c => c.pix_promo ? 24.9 : c.pix_ciclo==='QUARTERLY' ? 29.9 : c.pix_ciclo==='YEARLY' ? 0 : 12.9;
const brl = v => 'R$ ' + Number(v||0).toFixed(2).replace('.',',');
const nomeCiclo = c => c.pix_ciclo==='QUARTERLY' ? 'Trimestral' : c.pix_ciclo==='YEARLY' ? 'Anual' : 'Mensal';
const pixAberto = c => !!c.pix_gerado_em && c.sit!=='men' && c.sit!=='tri';
function chaveMsg(c){ if(pixAberto(c)) return 'pix'; if(c.sit==='venc') return (Date.now()-Date.parse(c.teste_ate))<48*H?'venc_promo':'venc'; return c.sit; }
function montarMsg(c){
  const fim=c.teste_ate?Date.parse(c.teste_ate):0, dias=Math.max(1,Math.ceil((fim-Date.now())/D));
  return lerMsgs()[chaveMsg(c)].replaceAll('{nome}',primeiro(c.nome)||'tudo bem').replaceAll('{prazo}',fmtData(fim+48*H,true)).replaceAll('{dias}',`${dias} dia${dias>1?'s':''}`).replaceAll('{plano}',nomeCiclo(c)).replaceAll('{valor}',brl(PRECO_PIX(c)))
    .replace('Oi, tudo bem!','Oi, tudo bem?');
}

/* ---------- telas ---------- */
function telaLogin(msg){
  app.innerHTML=`<form class="caixa" id="fl" autocomplete="on"><div class="marca">Cofre <em>dos Sonhos</em><small>Painel de clientes</small></div>
    <input id="ls" type="password" placeholder="Senha de acesso" required autocomplete="current-password">
    <button class="b ouro" type="submit">Entrar</button><p class="nota" id="lm">${esc(msg||'Acesso só do dono.')}</p></form>`;
  $('#ls').focus();
  $('#fl').onsubmit=async e=>{ e.preventDefault(); const m=$('#lm'), b=$('#fl button'); b.disabled=true; m.textContent='Entrando…';
    try{ const {ok,d}=await chamar({senha:$('#ls').value});
      if(!ok||!d.token){ m.textContent=d.erro||'Não deu para entrar agora.'; b.disabled=false; return; }
      gravarToken(d.token); iniciar();
    }catch(err){ m.textContent='Sem conexão. Tente de novo.'; b.disabled=false; } };
}
async function iniciar(){
  const t=lerToken(); if(!t) return telaLogin();
  app.innerHTML=`<p class="vazio">Carregando clientes…</p>`;
  let r; try{ r=await chamar({token:t}); }catch(e){ app.innerHTML=`<p class="vazio">Sem conexão. <button class="b" onclick="location.reload()">Tentar de novo</button></p>`; return; }
  if(r.status===401){ gravarToken(''); return telaLogin('Sua sessão terminou. Entre de novo.'); }
  if(!r.ok){ app.innerHTML=`<p class="vazio">${esc(r.d.erro||'Não deu para carregar.')}</p>`; return; }
  clientes=(r.d.clientes||[]).map(c=>({...c, sit:situacao(c)})); agora=r.d.agora||{};
  desenhar();
}
// "online agora": atualiza sozinho a cada minuto, sem tirar você da tela em que está
function textoOnline(){
  const p=[`${agora.app??0} no app`]; if(agora.visitantes!=null) p.push(`${agora.visitantes} visitante${agora.visitantes===1?'':'s'} no site`); if(agora.pagina!=null) p.push(`${agora.pagina} na página de vendas`);
  return `<i></i>Agora: ${p.join(' · ')}`;
}
setInterval(async()=>{
  const t=lerToken(); if(!t || document.hidden || !$('#pnOnline')) return;
  let r; try{ r=await chamar({token:t}); }catch(e){ return; } if(!r.ok) return;
  clientes=(r.d.clientes||[]).map(c=>({...c, sit:situacao(c)})); agora=r.d.agora||{};
  const el=$('#pnOnline'); if(el) el.innerHTML=textoOnline();
  if(aba==='clientes' && !$('#dlgMsg').open && $('#lista')){ const ch=$('[data-x="online"]'); if(ch) ch.textContent=`🟢 Online agora (${clientes.filter(c=>c.online).length})`; lista(); }
},60000);
/* ---------- estrutura: topo + abas (mesmo formato do painel da Fábrica) ---------- */
const ABAS=[['geral','Visão geral'],['clientes','Clientes'],['leads','Leads do Inspira'],['afiliados','Afiliados e saques'],['links','Links de divulgação']];
function desenhar(){
  app.innerHTML=`<header class="topo"><div class="marca">Cofre <em>dos Sonhos</em><small>Painel do dono</small></div>
      <button type="button" class="pn-online" id="pnOnline" title="Pessoas com o app ou o site aberto nos últimos 3 minutos. Toque para ver quem está no app.">${textoOnline()}</button>
      <button class="b pequeno" id="bMsgs">Mensagens prontas</button><button class="b pequeno" id="bAtual">Atualizar</button><button class="b pequeno" id="bSair">Sair</button></header>
    <main><nav class="pn-abas">${ABAS.map(([k,n])=>`<button class="pn-aba" data-aba="${k}" aria-pressed="${aba===k}">${n}${k==='clientes'?` (${clientes.length})`:''}</button>`).join('')}</nav><div id="corpo"></div></main>`;
  app.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{ aba=b.dataset.aba; desenhar(); });
  $('#pnOnline').onclick=()=>irPara('todos','online'); $('#bMsgs').onclick=editarMsgs; $('#bAtual').onclick=iniciar;
  $('#bSair').onclick=()=>{ gravarToken(''); telaLogin('Você saiu do painel.'); };
  if(aba==='clientes') telaClientes(); else if(aba==='links') telaLinks(); else if(aba==='afiliados') telaAfiliados(); else if(aba==='leads') telaLeads(); else visaoGeral();
}
function irPara(f,x){ aba='clientes'; filtro=f; extra=x||''; busca=''; desenhar(); window.scrollTo(0,0); }

/* ---------- visão geral ---------- */
const ETAPAS=[
  ['visitas','Visitaram o site','Pessoas diferentes que abriram o app'],
  ['inicio','Escolheram o sonho','Tocaram em Continuar no 1º passo'],
  ['conquista','Criaram a conquista','Viram o próprio wallpaper'],
  ['contas','Criaram a conta','E-mail e senha'],
  ['whatsapp','Informaram o WhatsApp','Cadastro completo'],
  ['teste','Ativaram o teste','7 dias de Premium'],
  ['pix','Geraram o Pix','Tentaram assinar'],
  ['pagou','Pagaram','Viraram clientes Premium']
];
const PERIODOS=[[1,'Hoje'],[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[3650,'Tudo']];
const num=n=>Number(n||0).toLocaleString('pt-BR');
const pct=(a,b)=>(b && a<=b) ? Math.round(a/b*1000)/10+'%' : '–';
async function visaoGeral(){
  const corpo=$('#corpo');
  corpo.innerHTML=`<div class="pn-topo"><h1>Visão <em>geral</em></h1><div class="pn-periodos">${PERIODOS.map(([d,n])=>`<button class="chip" data-d="${d}" aria-pressed="${funilDias===d}">${n}</button>`).join('')}</div></div><div id="geralCorpo"><p class="vazio">Carregando os números…</p></div>`;
  corpo.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ funilDias=+b.dataset.d; visaoGeral(); });
  const vez=++vezFunil;
  const r=await chamar({token:lerToken(), funil:funilDias}).catch(()=>null);
  if(vez!==vezFunil || !$('#geralCorpo')) return; // trocou de aba ou de período enquanto carregava
  if(!r){ $('#geralCorpo').innerHTML='<p class="vazio">Sem conexão.</p>'; return; }
  if(r.status===401){ gravarToken(''); return telaLogin('Sua sessão terminou. Entre de novo.'); }
  if(!r.ok){ $('#geralCorpo').innerHTML=`<p class="vazio">${esc(r.d.erro||'Não deu para carregar.')}</p>`; return; }
  funilDados=r.d.funil||{}; corpoGeral();
}

// ---------- saúde do SaaS (mesmo bloco nos painéis do Frankenstein, Fábrica Dark e Cofre) ----------
// O Cofre não guarda histórico no servidor para o painel: o tráfego do mês e o MRR de cada mês ficam salvos neste aparelho.
function lerSaas(){ try{ return JSON.parse(localStorage.getItem('cofre-saas')||'{}'); }catch(e){ return {}; } }
function gravarSaas(o){ try{ localStorage.setItem('cofre-saas',JSON.stringify(o)); }catch(e){} }
function saudeCofre(cont, mrr){
  const agora=Date.now(), mes=new Date(agora-3*H).toISOString().slice(0,7), ini=Date.parse(mes+'-01T03:00:00Z');
  const contas=clientes, pagantes=cont.men+cont.tri;
  // saíram no mês: tinham Premium pago e o plano acabou neste mês sem renovar
  const sairam=contas.filter(c=>c.assinatura_status==='cancelada' && c.plano_ate && Date.parse(c.plano_ate)>=ini && Date.parse(c.plano_ate)<=agora).length;
  const base=pagantes+sairam, churn=base?sairam/base:null, arpu=pagantes?mrr/pagantes:null;
  const testaram=contas.filter(c=>c.teste_ate).length;
  const pagouAlgumaVez=c=>c.sit==='men'||c.sit==='tri'||!!c.assinatura_status;
  const novos=contas.filter(c=>(c.sit==='men'||c.sit==='tri') && Date.parse(c.criado)>=ini).length;
  const conf=lerSaas(), trafego=Number(conf.trafego&&conf.trafego[mes]||0);
  const cac=trafego>0&&novos?trafego/novos:null, ltv=arpu==null?null:churn?arpu/churn:arpu*12;
  const usou=c=>c.ultimo_uso||c.visto_em;
  const ativados=contas.filter(usou).length;
  const ativos7=contas.filter(c=>{ const t=Date.parse(c.ultimo_uso||c.visto_em||0); return t && agora-t<7*D; }).length;
  conf.mrrMes=conf.mrrMes||{}; conf.mrrMes[mes]=Math.round(mrr*100)/100; gravarSaas(conf);
  const meses=Object.keys(conf.mrrMes).sort().slice(-13), ant=meses.filter(m=>m<mes).at(-1), mrrAnt=ant?conf.mrrMes[ant]:null;
  return { mes, acaoPrincipal:'usaram o app', mrr, arr:mrr*12, crescimento:mrrAnt?Math.round((mrr-mrrAnt)/mrrAnt*100):null,
    historico:meses.map(m=>({mes:m,mrr:conf.mrrMes[m]})), contas:contas.length, pagantes, arpu, sairam,
    churn:churn==null?null:Math.round(churn*1000)/10, testaram,
    conversao:testaram?Math.round(contas.filter(c=>c.teste_ate&&pagouAlgumaVez(c)).length/testaram*100):null,
    ativacao:contas.length?Math.round(ativados/contas.length*100):null, ativados,
    ativos7, engajamento:contas.length?Math.round(ativos7/contas.length*100):null,
    ltv, ltvEstimado:!churn, trafego, novosPagantes:novos, cac, ltvCac:cac&&ltv?Math.round(ltv/cac*10)/10:null,
    margem:mrr>0?Math.round((mrr-trafego)/mrr*100):null, receitaMes:mrr, custoTotal:trafego };
}
function blocoSaas(s){
  const pc=v=>v==null?'—':v+'%';
  const cor=(v,bom,ok,menor)=>v==null?'':(menor?(v<=bom?'s-verde':v<=ok?'s-ouro':'s-alerta'):(v>=bom?'s-verde':v>=ok?'s-ouro':'s-alerta'));
  const cards=[
    ['Receita recorrente (MRR)',brl(s.mrr),s.crescimento==null?'quanto entra todo mês com as assinaturas':`${s.crescimento>=0?'▲':'▼'} ${Math.abs(s.crescimento)}% vs mês passado`,s.mrr>0?'s-verde':'','Soma das mensalidades ativas (trimestral dividido por 3). É o número nº 1 de um SaaS.'],
    ['Receita anual (ARR)',brl(s.arr),'MRR × 12','','Quanto o app fatura em 1 ano se nada mudar. É o número que investidor olha.'],
    ['Assinantes pagando',num(s.pagantes),`de ${num(s.contas)} contas (liberados por você não contam)`,s.pagantes?'s-verde':'','Quem está pagando o Premium hoje.'],
    ['Ticket médio (ARPU)',s.arpu==null?'—':brl(s.arpu),'por assinante, por mês','','Quanto cada assinante paga em média por mês.'],
    ['Cancelamento (churn)',!s.pagantes&&!s.sairam?'—':pc(s.churn),`${s.sairam} saíram este mês · meta até 5%`,cor(s.churn,5,10,true),'Dos assinantes do início do mês, quantos % saíram. Quanto menor, melhor.'],
    ['Conversão teste → pago',pc(s.conversao),`de ${num(s.testaram)} que testaram · meta 15%+`,cor(s.conversao,15,7),'Dos que fizeram o teste de 7 dias, quantos % viraram assinantes.'],
    ['Ativação',pc(s.ativacao),`${s.ativados} ${s.acaoPrincipal} · meta 60%+`,cor(s.ativacao,60,35),'Quantos % das contas chegaram a usar o app de verdade. Quem não ativa, não assina.'],
    ['Ativos nos últimos 7 dias',pc(s.engajamento),`${s.ativos7} pessoas usaram · meta 40%+`,cor(s.engajamento,40,20),'Quantos % das contas usaram o app na última semana. Mostra se o app virou hábito.'],
    ['Valor do cliente (LTV)',s.ltv==null?'—':brl(s.ltv),s.ltv==null?'aparece com o 1º assinante':s.ltvEstimado?'estimado em 12 meses (sem cancelamentos ainda)':'ticket ÷ churn','','Quanto um assinante deixa de dinheiro durante todo o tempo que fica.'],
    ['Custo por assinante (CAC)',s.cac==null?'—':brl(s.cac),s.trafego?`${brl(s.trafego)} em anúncios ÷ ${s.novosPagantes} novos pagantes`:'preencha o tráfego pago do mês aqui embaixo','','Quanto você gasta em anúncio para ganhar 1 assinante novo.'],
    ['LTV ÷ CAC',s.ltvCac==null?'—':s.ltvCac+'x','meta 3x ou mais',cor(s.ltvCac,3,1),'Cada R$ 1 em anúncio volta quantas vezes. Abaixo de 1x, o anúncio dá prejuízo.'],
    ['Margem do mês',pc(s.margem),s.receitaMes?`MRR ${brl(s.receitaMes)} − ${brl(s.custoTotal)} de anúncios`:'aparece com o 1º assinante',cor(s.margem,60,20),'Quanto sobra de cada R$ 100 que entram, depois dos anúncios.']
  ];
  const max=Math.max(1,...s.historico.map(h=>h.mrr));
  return `<div class="pn-bloco pn-saas"><h2>Saúde do SaaS</h2><p class="mudo">Os números que todo micro-SaaS acompanha. Verde = saudável, amarelo = atenção, laranja = agir. Toque no ⓘ para entender cada um.</p>
    <div class="pn-kpis">${cards.map(([n,v,sub,c,ex])=>`<div class="pn-card ${c}"><span>${n} <i class="info" tabindex="0" title="${esc(ex)}">ⓘ</i></span><strong>${v}</strong><small>${esc(sub)}</small><em class="ex">${esc(ex)}</em></div>`).join('')}</div>
    <div class="pn-saas-trafego"><label>Tráfego pago neste mês (R$, Meta + TikTok) <input type="number" min="0" step="0.01" id="saasTrafego" value="${s.trafego||''}" placeholder="0,00"></label><button type="button" class="btn pequeno" id="saasSalvar">Salvar</button><small class="mudo">fica salvo neste aparelho</small></div>
    ${s.historico.length>1?`<h3>MRR mês a mês</h3><div class="pn-dias">${s.historico.map(h=>`<div class="pn-dia" title="${h.mes}: ${brl(h.mrr)}"><div class="pn-col"><i style="height:${Math.max(2,h.mrr/max*100)}%"></i></div><span>${h.mes.slice(5)}/${h.mes.slice(2,4)}</span></div>`).join('')}</div>`:''}
  </div>`;
}
function corpoGeral(){
  const cs=funilDados.campanhas||[], tot={}; ETAPAS.forEach(([k])=>tot[k]=cs.reduce((a,c)=>a+(+c[k]||0),0));
  const agora=Date.now(), cont={}; Object.keys(SIT).forEach(k=>cont[k]=0); clientes.forEach(c=>cont[c.sit]++);
  const nPix=clientes.filter(pixAberto).length;
  const venc48=clientes.filter(c=>c.sit==='venc' && agora-Date.parse(c.teste_ate)<48*H).length;
  const teste2=clientes.filter(c=>c.sit==='teste' && Date.parse(c.teste_ate)-agora<=2*D).length;
  const bas7=clientes.filter(c=>c.sit==='bas' && agora-Date.parse(c.criado)>=7*D).length;
  const premium=cont.men+cont.tri+cont.lib, mrr=cont.men*12.9+cont.tri*29.9/3;
  const card=(rot,val,sub,cls)=>`<div class="pn-card ${cls||''}"><span>${rot}</span><strong>${val}</strong>${sub?`<small>${sub}</small>`:''}</div>`;
  const acao=(rot,n,sub,f,x)=>`<button type="button" class="pn-card ${n?'alerta':''}" data-f="${f}" data-x="${x||''}"><span>${rot}</span><strong>${n}</strong><small>${sub}</small></button>`;
  let h=`<div class="pn-kpis">
      ${card('Visitas no site',num(tot.visitas),'pessoas diferentes no período')}
      ${card('Contas criadas',num(tot.contas),pct(tot.contas,tot.visitas)+' das visitas')}
      ${card('Testes ativados',num(tot.teste),num(tot.pix)+' geraram Pix')}
      ${card('Pagaram',num(tot.pagou),pct(tot.pagou,tot.visitas)+' das visitas viraram venda','destaque')}
      ${card('Premium ativos agora',num(premium),`${cont.men} mensal · ${cont.tri} trimestral · ${cont.lib} liberado${cont.lib===1?'':'s'}`,'ouro')}
      ${card('Receita por mês',brl(mrr),'estimada pelos planos pagos ativos','destaque')}
      ${card('Testes em andamento',num(cont.teste),`${teste2} acaba${teste2===1?'':'m'} em até 2 dias`)}
      ${card('Básico vitalício',num(cont.bas),`${bas7} há mais de 7 dias (dá pra oferecer Premium)`)}
    </div>
    ${(()=>{ try{ return blocoSaas(saudeCofre(cont,mrr)); }catch(e){ return ''; } })()}
    <div class="pn-bloco"><h2>Precisa de atenção agora</h2><p class="mudo">Toque num cartão para abrir a lista dessas pessoas já com a mensagem certa para o WhatsApp.</p><div class="pn-acoes">
      ${acao('Gerou Pix e não pagou',nPix,'quase compraram','pix')}
      ${acao('Teste venceu há menos de 48h',venc48,'hora da oferta com desconto','todos','venc48')}
      ${acao('Teste acabando',teste2,'faltam 2 dias ou menos','todos','teste2')}
      ${acao('Básico há 7+ dias',bas7,'prontos para o Premium','todos','bas7')}
    </div></div>`;
  // funil
  const topo=Math.max(1,...ETAPAS.map(([k])=>tot[k]));
  h+=`<div class="pn-bloco"><h2>Funil de vendas</h2><p class="mudo">Cada etapa conta pessoas. Ao lado, quantas passaram da etapa anterior. Onde a barra cai mais é onde você está perdendo gente.</p><div class="pn-funil">${ETAPAS.map(([k,n,dsc],i)=>{ const v=tot[k], ant=i?tot[ETAPAS[i-1][0]]:null, perdeu=ant!==null&&ant>v?ant-v:0;
    return `<div class="pn-linha"><span class="pn-rot">${i+1}. ${n}<small>${dsc}</small></span><div class="pn-barra ${k==='pagou'?'verde':''}"><i style="width:${Math.max(2,v/topo*100)}%"></i></div><b>${num(v)}</b><span class="pn-conv">${i?`<em>${pct(v,ant)}</em>${perdeu?` · ${perdeu} não chegaram`:''}`:''}</span></div>`; }).join('')}</div></div>`;
  // dia a dia
  const dias=funilDados.dias||[], maxD=Math.max(1,...dias.map(d=>d.visitas||0));
  if(dias.length) h+=`<div class="pn-bloco"><h2>Dia a dia</h2><p class="mudo">Barra dourada = visitas no site. Embaixo de cada dia: <b class="pn-leg">contas criadas</b>. Passe o dedo/mouse no dia para ver tudo.</p><div class="pn-dias">${dias.map(d=>`<div class="pn-dia" title="${esc(d.dia)}: ${d.visitas||0} visitas, ${d.contas||0} contas"><div class="pn-col"><i style="height:${Math.max(2,(d.visitas||0)/maxD*100)}%"></i><em>${d.visitas||''}</em></div><small class="pn-dia-num"><b>${d.contas||0}</b></small><span>${new Date(d.dia+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span></div>`).join('')}</div></div>`;
  // origem
  h+=`<div class="pn-bloco"><h2>De onde vêm as pessoas</h2><p class="mudo">Use os links da aba <b>Links de divulgação</b> (ou um cupom) em cada lugar para saber o que traz cliente de verdade.</p>
    ${cs.length?`<div class="tabela-caixa"><table><thead><tr><th>Origem</th><th>Visitas</th><th>Contas</th><th>Teste</th><th>Pix</th><th>Pagaram</th><th>Visita → venda</th></tr></thead><tbody>
      ${cs.map(c=>`<tr><td><b>${esc(c.campanha==='DIRETO'?'Direto (sem código)':c.campanha)}</b></td><td>${num(c.visitas)}</td><td>${num(c.contas)}</td><td>${num(c.teste)}</td><td>${num(c.pix)}</td><td><b style="color:var(--aurora)">${num(c.pagou)}</b></td><td>${pct(c.pagou,c.visitas)}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="vazio">Ainda sem dados neste período.</p>'}</div>`;
  // clientes por situação
  const maxS=Math.max(1,...Object.values(cont));
  h+=`<div class="pn-bloco"><h2>Clientes por situação</h2><p class="mudo">Todos os clientes, hoje. Toque numa linha para ver a lista.</p><div class="pn-funil">${Object.entries(SIT).map(([k,s])=>`<div class="pn-linha" role="button" tabindex="0" data-sit="${k}" style="cursor:pointer"><span class="pn-rot"><span class="tag ${s.c}">${s.n}</span></span><div class="pn-barra ${['men','tri','lib'].includes(k)?'verde':''}"><i style="width:${Math.max(2,cont[k]/maxS*100)}%"></i></div><b>${num(cont[k])}</b><span class="pn-conv">${pct(cont[k],clientes.length)} do total</span></div>`).join('')}</div></div>
    <p class="nota">Visitas contam pessoas diferentes por dia, sem guardar nenhum dado pessoal. Os números de visita começam em 01/11/2026; as etapas de conta, WhatsApp, teste, Pix e pagamento já incluem quem chegou antes. A receita por mês é uma estimativa (mensal R$ 12,90 e trimestral R$ 29,90 ÷ 3).</p>`;
  const g=$('#geralCorpo'); g.innerHTML=h;
  const bs=$('#saasSalvar'); if(bs) bs.onclick=()=>{ const c=lerSaas(), m=new Date(Date.now()-3*H).toISOString().slice(0,7); c.trafego=c.trafego||{}; c.trafego[m]=Math.max(0,Number(String($('#saasTrafego').value).replace(',','.'))||0); gravarSaas(c); corpoGeral(); };
  g.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>irPara(b.dataset.f,b.dataset.x));
  g.querySelectorAll('[data-sit]').forEach(b=>{ const ir=()=>irPara(b.dataset.sit); b.onclick=ir; b.onkeydown=e=>{ if(e.key==='Enter') ir(); }; });
}

/* ---------- clientes ---------- */
function telaClientes(){
  const cont={}; Object.keys(SIT).forEach(k=>cont[k]=0); clientes.forEach(c=>cont[c.sit]++);
  const semZap=clientes.filter(c=>!c.whatsapp).length, nPix=clientes.filter(pixAberto).length;
  $('#corpo').innerHTML=`<div class="pn-topo"><h1>Clientes</h1><button class="b pequeno" id="bCsv">Baixar planilha</button></div>
    <div class="pn-kpis" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">

  $('#ok').onclick=()=>{ const o={}; d.querySelectorAll('textarea').forEach(t=>o[t.dataset.k]=t.value); try{ localStorage.setItem('painel-msgs',JSON.stringify(o)); }catch(e){} d.close(); };
}
function baixarCsv(){
  const linhas=[['Nome','WhatsApp','Aceitou WhatsApp','E-mail','Situação','Detalhe','Cadastro','Instagram','Campanha']]
    .concat(visiveis().map(c=>[c.nome||'',c.whatsapp||'',c.whatsapp_aceite?'sim':'não',c.email,SIT[c.sit].n,detalhe(c).replace(/<[^>]+>/g,''),fmtData(Date.parse(c.criado)),c.instagram||'',c.campanha||'']));
  const csv='﻿'+linhas.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='clientes-cofre-dos-sonhos.csv'; a.click();
}
iniciar();
})();
